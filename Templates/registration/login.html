{% extends "base.html" %}
{% block title %}Sign in — Rasheed{% endblock %}
{% block content %}
<div style="max-width:340px;margin:80px auto;font-family:sans-serif;">
  <h2>Rasheed</h2>
  {% if form.errors %}<p style="color:#C23B2E;">Invalid username or password.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Username</label><br>
    <input type="text" name="username" required style="width:100%;padding:8px;margin:6px 0 14px;"><br>
    <label>Password</label><br>
    <input type="password" name="password" required style="width:100%;padding:8px;margin:6px 0 14px;"><br>
    <button type="submit" style="width:100%;padding:10px;background:#2E7BD6;color:#fff;border:none;border-radius:6px;">Sign in</button>
  </form>
</div>
{% endblock %}
